name: Build APK

# 云端 CI：推到 main 后自动编译出 APK（内含 NDK 交叉编译的 arm64 tcpdump）
# 产物在 Actions 页面 Artifacts 下载。也可手动触发。

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: udp_monitor_app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK & NDK
        run: |
          SDKM=$(find "$ANDROID_HOME" -path '*/cmdline-tools/*/bin/sdkmanager' 2>/dev/null | head -1)
          if [ -z "$SDKM" ]; then SDKM=$(find "$ANDROID_HOME" -name sdkmanager 2>/dev/null | head -1); fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Cross-compile tcpdump for arm64
        run: |
          chmod +x scripts/build-tcpdump-android.sh
          ./scripts/build-tcpdump-android.sh

      - name: Copy tcpdump into app assets
        run: |
          mkdir -p app/src/main/assets
          cp build_native/tcpdump app/src/main/assets/tcpdump
          ls -la app/src/main/assets/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: udp-monitor-debug-apk
          path: udp_monitor_app/app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: udp-monitor-release-apk
          path: udp_monitor_app/app/build/outputs/apk/release/*.apk

      - name: Upload tcpdump binary (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: tcpdump-arm64
          path: udp_monitor_app/build_native/tcpdump